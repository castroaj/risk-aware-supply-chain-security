[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-classifier"
version = "0.1.0"
description = "ML-gated risk classifier for software supply chain security"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.3",
    "numpy>=1.24,<3.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
risk-classifier-label   = "classifier.cli:main_label"
risk-classifier-train   = "classifier.cli:main_train"
risk-classifier-predict = "classifier.cli:main_predict"

[tool.setuptools.packages.find]
where = ["src"]
