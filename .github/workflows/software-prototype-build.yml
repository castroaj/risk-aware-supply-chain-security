name: Software Prototype Build

on:
  pull_request:
    paths:
      - "software-prototype/**"
      - "ml-classifier/**"
      - ".github/workflows/software-prototype-build.yml"
  push:
    branches:
      - main
    paths:
      - "software-prototype/**"
      - "ml-classifier/**"
      - ".github/workflows/software-prototype-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: software-prototype-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + SBOM/Vuln Scan (Python 3.14)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software-prototype

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run application smoke test
        run: uv run software-prototype

      - name: Build package artifacts
        run: uv build

      - name: Build Docker image for scanning
        run: docker build -t software-prototype:ci .

      - name: Generate CycloneDX SBOM (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: software-prototype:ci
          format: cyclonedx
          output: trivy-sbom.cdx.json
          scanners: vuln

      - name: Generate JSON vulnerability report (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: software-prototype:ci
          format: json
          output: trivy-vuln-report.json
          scanners: vuln
          skip-setup-trivy: true

      - name: Enforce vulnerability policy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: software-prototype:ci
          format: table
          severity: CRITICAL
          exit-code: 1
          scanners: vuln
          skip-setup-trivy: true

      - name: Install ML risk classifier
        working-directory: ${{ github.workspace }}/ml-classifier
        run: make install

      - name: Classify SBOM with ML risk model
        id: classify
        working-directory: ${{ github.workspace }}
        run: |
          ml-classifier/.venv/bin/risk-classifier-predict \
            --sbom "${{ github.workspace }}/trivy-sbom.cdx.json" \
            --artifact-dir "${{ github.workspace }}/ml-classifier/model-results/latest/" \
            --format json \
            --output "${{ github.workspace }}/ml-classification-report.json"

          echo "CLASSIFICATION RESULT"
          echo "====================="
          cat ${{ github.workspace }}/ml-classification-report.json
          echo "====================="

          ML_RESULT=$(python -c "
          import json
          data = json.load(open('${{ github.workspace }}/ml-classification-report.json'))
          label = data[0]['ml_label']
          confidence = data[0].get('ml_confidence', 'N/A')
          print(f'{label}:{confidence}')
          ")

          ML_LABEL="${ML_RESULT%%:*}"
          ML_CONFIDENCE="${ML_RESULT##*:}"

          echo "ml_label=${ML_LABEL}" >> $GITHUB_OUTPUT
          echo "ml_confidence=${ML_CONFIDENCE}" >> $GITHUB_OUTPUT

          if [ "$ML_LABEL" = "BLOCK" ]; then
            echo "::error::ML risk classifier returned BLOCK (confidence=${ML_CONFIDENCE}). Deployment blocked."
            exit 1
          elif [ "$ML_LABEL" = "WARN" ]; then
            echo "::warning::ML risk classifier returned WARN (confidence=${ML_CONFIDENCE}). Review recommended before deployment."
          else
            echo "ML risk classifier returned ALLOW (confidence=${ML_CONFIDENCE}). Proceeding."
          fi

      - name: Write ML classification to job summary
        if: always() && steps.classify.outputs.ml_label != ''
        run: |
          ML_LABEL="${{ steps.classify.outputs.ml_label }}"
          ML_CONFIDENCE="${{ steps.classify.outputs.ml_confidence }}"
          case "$ML_LABEL" in
            ALLOW) ICON="✅" ;;
            WARN)  ICON="⚠️" ;;
            BLOCK) ICON="🚫" ;;
            *)     ICON="❓" ;;
          esac
          {
            echo "## ${ICON} ML Risk Classification: \`${ML_LABEL}\`"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Label | \`${ML_LABEL}\` |"
            echo "| Confidence | ${ML_CONFIDENCE} |"
            echo "| Model | \`$(readlink ${{ github.workspace }}/ml-classifier/model-results/latest)\` |"
            echo "| SBOM | \`trivy-sbom.cdx.json\` |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Post ML classification comment to PR
        if: github.event_name == 'pull_request' && steps.classify.outputs.ml_label != 'ALLOW'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ML_LABEL="${{ steps.classify.outputs.ml_label }}"
          ML_CONFIDENCE="${{ steps.classify.outputs.ml_confidence }}"
          MODEL=$(readlink ${{ github.workspace }}/ml-classifier/model-results/latest)
          case "$ML_LABEL" in
            WARN)  ICON="⚠️" ; MESSAGE="Elevated supply chain risk detected. Review recommended before merging." ;;
            BLOCK) ICON="🚫" ; MESSAGE="High supply chain risk detected. Deployment blocked — security review required." ;;
          esac
          gh pr comment ${{ github.event.pull_request.number }} --body "## ${ICON} ML Risk Classifier: \`${ML_LABEL}\`

          ${MESSAGE}

          | Field | Value |
          |---|---|
          | Label | \`${ML_LABEL}\` |
          | Confidence | ${ML_CONFIDENCE} |
          | Model | \`${MODEL}\` |
          | SBOM | \`trivy-sbom.cdx.json\` |

          See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the full classification report."

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: software-prototype-dist
          path: software-prototype/dist/*
          if-no-files-found: error

      - name: Upload security scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: software-prototype-security-reports
          path: |
            trivy-sbom.cdx.json
            trivy-vuln-report.json
          if-no-files-found: error

      - name: Upload ML-Classification Result
        uses: actions/upload-artifact@v4
        with:
          name: software-prototype-ml-classification
          path: |
            ml-classification-report.json
          if-no-files-found: error
