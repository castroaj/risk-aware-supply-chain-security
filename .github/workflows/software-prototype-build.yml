name: Software Prototype Build

on:
  pull_request:
    paths:
      - "software-prototype/**"
      - ".github/workflows/software-prototype-build.yml"
  push:
    branches:
      - main
    paths:
      - "software-prototype/**"
      - ".github/workflows/software-prototype-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: software-prototype-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Python 3.14)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software-prototype

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run application smoke test
        run: uv run software-prototype

      - name: Build package artifacts
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: software-prototype-dist
          path: software-prototype/dist/*
          if-no-files-found: error

